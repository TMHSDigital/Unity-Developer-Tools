name: Bug report
description: Something in the plugin or MCP server does not work
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - MCP server
        - Skill
        - Rule
        - Snippet
        - Template
        - Plugin install or manifest
        - CI or docs
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Include error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: v1.5.3
  - type: input
    id: host
    attributes:
      label: Host and version
      description: Cursor, Claude Code, or another MCP client
      placeholder: Cursor 2.x
  - type: input
    id: unity-version
    attributes:
      label: Unity version
      placeholder: 6000.3.x
  - type: input
    id: os
    attributes:
      label: Operating system
